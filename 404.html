<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost — Princess of Reality</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="./static-section.css">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; }
  .lost {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem 1.4rem;
  }
  .lost h1 {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(2rem, 8vw, 3rem);
    color: var(--ink);
    margin-bottom: 0.75rem;
  }
  .lost p { color: var(--ink-dim); max-width: 28rem; margin-bottom: 1.5rem; }
  .lost a {
    font-family: 'Space Mono', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--green);
    border: 1px solid rgba(53,201,143,0.4);
    border-radius: 16px;
    padding: 0.55rem 1rem;
  }
</style>
</head>
<body>
  <div class="lost">
    <p class="eyebrow">404</p>
    <h1>This room is not here</h1>
    <p>The path does not open onto a chamber of this house. Return to the scroll, or step through a known door.</p>
    <a href="./">Enter the scroll</a>
  </div>
</body>
</html>
