<html lang="en">

<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap');

:root {
  --void: #06050c;
  --ink: #efe9e0;
  --ink-dim: #9a92a4;

  --green: #35c98f;
  --pink: #ec5aa0;
  --purple: #8a5cf0;

  --green-glow: rgba(53,201,143,0.35);
  --pink-glow: rgba(236,90,160,0.35);
  --purple-glow: rgba(138,92,240,0.35);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--void);
  color: var(--ink);
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  overflow: hidden;
  height: 100vh;
  height: 100dvh;
}

.eyebrow {
  font-family: 'Space Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--ink-dim);
  display: block;
  margin-bottom: 1.2rem;
}

/* ═══════════════════════════════════════
   SCROLL CONTAINER — the whole mechanism
   lives on these three properties.
   ═══════════════════════════════════════ */
#scroller {
  height: 100vh;
  height: 100dvh;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
  scroll-behavior: smooth; /* only used for dot-nav clicks; loop jumps override this per-call */
  -webkit-overflow-scrolling: touch;
  position: relative;
  z-index: 1;
}
/* momentarily disabled during a loop jump so the jump is invisible */
#scroller.jumping { scroll-behavior: auto; }

/* ═══════════════════════════════════════
   GLOBAL COSMIC BACKDROP — sits fixed behind
   every section (sections have no opaque bg
   of their own, so this shows through everywhere).
   Three layers: twinkling stars, a slow-rotating
   aurora wash, a vignette to deepen the edges.
   ═══════════════════════════════════════ */
#cosmic-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 40%, #0d0b18 0%, var(--void) 70%);
}
.star-layer {
  position: absolute;
  inset: 0;
  width: 1px;
  height: 1px;
  border-radius: 50%;
}
.star-layer.a { animation: twinkle 5s ease-in-out infinite; }
.star-layer.b { animation: twinkle 7s ease-in-out infinite reverse; }
@keyframes twinkle {
  0%, 100% { opacity: 0.15; }
  50% { opacity: 0.5; }
}
.aurora-wash {
  position: absolute;
  inset: -60%;
  background: conic-gradient(from 0deg at 50% 50%,
    var(--green-glow), var(--purple-glow), var(--pink-glow), var(--green-glow));
  filter: blur(90px);
  opacity: 0.28;
  mix-blend-mode: screen;
  animation: aurora-spin 70s linear infinite;
}
@keyframes aurora-spin { to { transform: rotate(360deg); } }
.cosmic-vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 35%, rgba(6,5,12,0.9) 100%);
}
@media (prefers-reduced-motion: reduce) {
  .star-layer, .aurora-wash { animation: none; }
}

.section {
  height: 100vh;
  height: 100dvh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  padding: 5.5rem 2rem 2.5rem;
  text-align: center;
  touch-action: pan-y; /* let the browser handle vertical panning; JS owns horizontal */
}

/* ── Detail panel: slides in from the right on swipe-left ── */
.detail {
  position: absolute;
  inset: 0;
  transform: translateX(100%);
  transition: transform 0.38s cubic-bezier(.22,.61,.36,1);
  background: linear-gradient(160deg, rgba(6,5,12,0.98), rgba(6,5,12,1));
  z-index: 6;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 5.5rem 2rem 3rem;
  text-align: left;
  scrollbar-width: none;
  touch-action: pan-y; /* same reasoning as .section — vertical stays native, horizontal is ours to detect */
}
.detail::-webkit-scrollbar { display: none; }
.detail.dragging { transition: none; } /* transition off while finger is tracking it */
.section.detail-open .detail { transform: translateX(0); }

.detail-close {
  position: absolute;
  top: 1.6rem;
  right: 1.8rem;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.04);
  color: var(--ink-dim);
  font-size: 1rem;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 7;
}

.swipe-hint {
  position: absolute;
  right: 0.9rem;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
  font-family: 'Space Mono', monospace;
  font-size: 0.55rem;
  letter-spacing: 0.1em;
  color: var(--ink-dim);
  text-transform: uppercase;
  opacity: 0.55;
  z-index: 2;
  pointer-events: none;
}

.detail h2 {
  font-size: clamp(1.8rem, 6vw, 2.6rem);
  font-style: italic;
  font-weight: 300;
  margin-bottom: 1rem;
}
.detail p { color: var(--ink-dim); font-size: 0.92rem; line-height: 1.6; margin-bottom: 0.9rem; }

.detail-list { margin-top: 0.6rem; }
.detail-list .item { padding: 0.6rem 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
.detail-list .item:last-child { border-bottom: none; }
.detail-list .item .h { font-style: italic; color: var(--ink); display: block; font-size: 1rem; }
.detail-list .item .d { color: var(--ink-dim); font-size: 0.8rem; display: block; margin-top: 0.15rem; line-height: 1.4; }

.view-full-link {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  margin-top: 1.1rem;
  font-family: 'Space Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-dim);
  text-decoration: none;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 20px;
  padding: 0.45rem 0.9rem;
}
.view-full-link:hover { color: var(--ink); border-color: rgba(255,255,255,0.35); }

.cosmology-embed {
  width: 100%;
  height: 500px;
  border: none;
  border-radius: 8px;
  margin-top: 0.8rem;
  background: #06050c;
}

/* ── Custom Haylynn player (SoundCloud Widget API, no visible SC UI) ── */
.hy-player {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  margin-top: 1.1rem;
  padding: 0.9rem 1rem;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  background: rgba(255,255,255,0.03);
}
.hy-play-btn {
  flex: 0 0 auto;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid var(--purple);
  background: rgba(138,92,240,0.12);
  color: var(--purple);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.hy-play-btn-lg { width: 44px; height: 44px; }
.hy-play-btn:hover { background: rgba(138,92,240,0.25); }
.hy-play-btn .icon-pause { display: none; }
.hy-player.is-playing .hy-play-btn .icon-play { display: none; }
.hy-player.is-playing .hy-play-btn .icon-pause { display: block; }

.hy-player-info { flex: 1 1 auto; min-width: 0; }
.hy-track-title {
  font-style: italic;
  color: var(--ink);
  font-size: 0.95rem;
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.hy-track-time {
  font-family: 'Space Mono', monospace;
  font-size: 0.6rem;
  color: var(--ink-dim);
  display: block;
  margin-top: 0.2rem;
}
.hy-progress-track {
  height: 4px;
  border-radius: 2px;
  background: rgba(255,255,255,0.1);
  margin-top: 0.5rem;
  cursor: pointer;
  overflow: hidden;
}
.hy-player-full .hy-progress-track { margin-top: 0.8rem; }
.hy-progress-fill {
  height: 100%;
  width: 0%;
  background: var(--purple);
  border-radius: 2px;
  transition: width 0.15s linear;
}

.hy-player-full { flex-direction: column; align-items: stretch; gap: 0.7rem; }
.hy-player-controls { display: flex; align-items: center; justify-content: center; gap: 1.2rem; }
.hy-nav-btn {
  background: none;
  border: none;
  color: var(--ink-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
}
.hy-nav-btn:hover { color: var(--ink); }
.hy-player-full .hy-player-info { display: flex; justify-content: space-between; align-items: baseline; gap: 0.6rem; }
.hy-player-full .hy-track-time { margin-top: 0; flex: 0 0 auto; }

.lyric-track-play {
  font-family: 'Space Mono', monospace;
  font-size: 0.55rem;
  letter-spacing: 0.05em;
  color: var(--purple);
  opacity: 0;
  margin-left: 0.4rem;
  transition: opacity 0.15s;
}
.lyric-track[data-track-index] { cursor: pointer; }
.lyric-track[data-track-index]:hover .lyric-track-play { opacity: 1; }
.lyric-track[data-track-index]:hover .lyric-track-num { color: var(--purple); }

.meta-note {
  font-family: 'Space Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.02em;
  color: var(--ink-dim);
  opacity: 0.7;
  margin-top: 1.2rem;
  line-height: 1.5;
}

.lyric-track { margin-top: 1.6rem; padding-top: 1.6rem; border-top: 1px solid rgba(255,255,255,0.1); }
.lyric-track-num { font-family: 'Space Mono', monospace; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--purple); display: block; margin-bottom: 0.6rem; }
.lyric-block { margin-top: 1rem; }
.lyric-label { font-family: 'Space Mono', monospace; font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); display: block; margin-top: 0.9rem; margin-bottom: 0.2rem; }
.lyric-text { color: var(--ink); font-size: 0.92rem; line-height: 1.55; margin-bottom: 0; }
.literal-toggle { margin-top: 1.2rem; }
.literal-toggle summary {
  font-family: 'Space Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-dim);
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 20px;
  padding: 0.5rem 1rem;
  display: inline-block;
}
.literal-toggle summary:hover { color: var(--ink); border-color: rgba(255,255,255,0.35); }
.literal-toggle .lyric-text { color: var(--ink-dim); font-style: italic; }

.lyric-track-pending {
  padding-top: 0.9rem;
  padding-bottom: 0.9rem;
}
.lyric-track-pending .lyric-track-num { margin-bottom: 0; color: var(--ink-dim); opacity: 0.6; }
.lyric-track-tag {
  font-family: 'Space Mono', monospace;
  font-size: 0.55rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--green);
  border: 1px solid var(--green);
  border-radius: 20px;
  padding: 0.1rem 0.45rem;
  margin-left: 0.4rem;
}

/* ── Kaviru detail: flush layout for the embedded guide ── */
.section[data-id="kaviru"] .detail {
  display: flex;
  flex-direction: column;
  padding: 0;
}
.section[data-id="kaviru"] .detail .embed-header {
  padding: 5.5rem 2rem 1rem;
  flex: 0 0 auto;
}
.section[data-id="kaviru"] .detail #kaviru-frame {
  flex: 1 1 0;
  min-height: 0;
  width: 100%;
  border: none;
  display: block;
  background: #050608;
}

/* ── LYMP detail: tabbed sky dashboard (ISS / Aurora / Gallery) ── */
.section[data-id="lymp"] .detail {
  display: flex;
  flex-direction: column;
  padding: 0;
}
.section[data-id="lymp"] .detail .embed-header {
  padding: 5.5rem 2rem 1rem;
  flex: 0 0 auto;
}
.sky-tabs { display: flex; gap: 0.5rem; margin-top: 0.9rem; flex-wrap: wrap; }
.sky-tab {
  font-family: 'Space Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-dim);
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 20px;
  padding: 0.45rem 0.85rem;
  cursor: pointer;
}
.sky-tab:hover { color: var(--ink); border-color: rgba(255,255,255,0.35); }
.sky-tab.active { color: var(--void); background: var(--pink); border-color: var(--pink); }

.sky-panels { flex: 1 1 0; min-height: 0; position: relative; }
.sky-panel { display: none; height: 100%; flex-direction: column; }
.sky-panel.active { display: flex; }
.sky-panel iframe {
  flex: 1 1 0;
  min-height: 0;
  width: 100%;
  border: none;
  display: block;
  background: #050608;
}
.sky-panel img {
  flex: 1 1 0;
  min-height: 0;
  width: 100%;
  object-fit: contain;
  background: #050608;
}
.sky-caption {
  flex: 0 0 auto;
  font-family: 'Space Mono', monospace;
  font-size: 0.62rem;
  color: var(--ink-dim);
  padding: 0.6rem 2rem;
}
.sky-note {
  flex: 0 0 auto;
  color: var(--ink-dim);
  font-size: 0.85rem;
  padding: 0 2rem 0.8rem;
  line-height: 1.5;
}
.sky-linkcard {
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 2rem;
  gap: 1rem;
}
.sky-linkcard .sky-note { padding: 0; max-width: 340px; }
.embed-fallback {
  flex: 0 0 auto;
  padding: 0.8rem 2rem 1.6rem;
  font-size: 0.75rem;
  color: var(--ink-dim);
}

/* nebula backdrop per section — three recurring hue moods */
.section::before {
  content: '';
  position: absolute;
  inset: -20%;
  background:
    radial-gradient(circle at 25% 30%, var(--glow-a) 0%, transparent 45%),
    radial-gradient(circle at 75% 70%, var(--glow-b) 0%, transparent 50%);
  filter: blur(40px);
  animation: drift 22s ease-in-out infinite alternate;
  z-index: 0;
}
/* per-section starfield removed — superseded by the global twinkling #cosmic-bg layer */

@keyframes drift {
  0%   { transform: translate(0,0) scale(1); }
  100% { transform: translate(-3%, 4%) scale(1.08); }
}

.mood-green  { --glow-a: var(--green-glow);  --glow-b: var(--purple-glow); }
.mood-pink   { --glow-a: var(--pink-glow);   --glow-b: var(--green-glow); }
.mood-purple { --glow-a: var(--purple-glow); --glow-b: var(--pink-glow); }

.content { position: relative; z-index: 1; max-width: 560px; width: 100%; }

.section-title {
  font-size: clamp(2.4rem, 7vw, 4.2rem);
  font-style: italic;
  font-weight: 300;
  line-height: 1.05;
  margin-bottom: 1.2rem;
}

.book-cover {
  display: block;
  width: 100%;
  max-width: 190px;
  margin: 0 auto 1.4rem;
  border-radius: 6px;
  box-shadow: 0 0 40px var(--pink-glow), 0 0 80px var(--purple-glow), 0 10px 30px rgba(0,0,0,0.5);
}

.section p {
  color: var(--ink-dim);
  font-size: clamp(1rem, 2.2vw, 1.15rem);
  line-height: 1.6;
}

.mood-green .section-title  { color: var(--green); text-shadow: 0 0 40px var(--green-glow); }
.mood-pink .section-title   { color: var(--pink); text-shadow: 0 0 40px var(--pink-glow); }
.mood-purple .section-title { color: var(--purple); text-shadow: 0 0 40px var(--purple-glow); }

.content { max-height: calc(100vh - 8rem); max-height: calc(100dvh - 8rem); overflow-y: auto; scrollbar-width: none; }
.content::-webkit-scrollbar { display: none; }

.section-tag {
  font-family: 'Space Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-dim);
}

/* ── Kaviru: epistemic markers ── */
.epistemic-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.5rem;
  margin: 1.4rem 0;
}
.ep-chip {
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 0.6rem 0.4rem;
  background: rgba(255,255,255,0.03);
}
.ep-chip .word { display: block; font-style: italic; color: var(--green); font-size: 1rem; }
.ep-chip .label { display: block; font-family: 'Space Mono', monospace; font-size: 0.5rem; letter-spacing: 0.08em; color: var(--ink-dim); text-transform: uppercase; margin-top: 0.15rem; }

/* ── Kaviru: root word strip ── */
.vocab-strip {
  display: flex;
  gap: 0.7rem;
  overflow-x: auto;
  scroll-snap-type: x proximity;
  padding: 0.4rem 0 0.6rem;
  margin-top: 0.6rem;
  scrollbar-width: none;
}
.vocab-strip::-webkit-scrollbar { display: none; }
.vocab-chip {
  flex: 0 0 auto;
  scroll-snap-align: start;
  width: 92px;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 0.6rem 0.4rem;
  text-align: center;
  background: rgba(255,255,255,0.03);
}
.vocab-chip svg { display: block; margin: 0 auto 0.3rem; }
.vocab-chip .w { display: block; font-style: italic; font-size: 0.95rem; color: var(--ink); }
.vocab-chip .m { display: block; font-size: 0.65rem; color: var(--ink-dim); margin-top: 0.15rem; line-height: 1.2; }

/* ── Chronicle: volume list ── */
.volume-list { text-align: left; margin-top: 1.2rem; }
.volume-list .vol {
  display: flex;
  gap: 0.8rem;
  align-items: baseline;
  padding: 0.5rem 0;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.volume-list .vol:last-child { border-bottom: none; }
.volume-list .num { font-family: 'Space Mono', monospace; font-size: 0.65rem; color: var(--pink); flex: 0 0 22px; }
.volume-list .name { font-style: italic; color: var(--ink); font-size: 0.95rem; }

/* ── Haylynn: track strip ── */
.track-list { text-align: left; margin-top: 1.2rem; }
.track {
  display: flex;
  justify-content: space-between;
  padding: 0.55rem 0;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  font-size: 0.9rem;
}
.track:last-child { border-bottom: none; }
.track .n { color: var(--ink); font-style: italic; }
.track .t { color: var(--ink-dim); font-family: 'Space Mono', monospace; font-size: 0.7rem; }

/* ── Hananaru: product cards ── */
.product-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.7rem;
  margin-top: 1.2rem;
}
.product-card {
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 1rem 0.7rem;
  background: rgba(255,255,255,0.03);
  position: relative;
}
.product-card .tag {
  position: absolute;
  top: 0.5rem;
  right: 0.5rem;
  font-family: 'Space Mono', monospace;
  font-size: 0.45rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--green);
  border: 1px solid var(--green);
  border-radius: 20px;
  padding: 0.15rem 0.4rem;
}
.product-card svg { margin: 0.4rem auto 0.6rem; display: block; }
.product-card .name { font-style: italic; color: var(--ink); font-size: 0.95rem; }
.product-card .price { font-family: 'Space Mono', monospace; font-size: 0.7rem; color: var(--ink-dim); margin-top: 0.2rem; display: block; }

/* ── LYMP: astro cards ── */
.astro-grid { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 1.2rem; text-align: left; }
.astro-card {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 0.7rem 0.9rem;
  background: rgba(255,255,255,0.03);
}
.astro-card .name { font-style: italic; color: var(--ink); font-size: 0.95rem; display: block; }
.astro-card .desc { color: var(--ink-dim); font-size: 0.75rem; display: block; margin-top: 0.1rem; }

/* ═══════════════════════════════════════
   SIDE DOT NAV — constellation style
   ═══════════════════════════════════════ */
#dots {
  position: fixed;

  <div style="max-width:600px;margin:3rem auto;padding:0 1.5rem;font-family:Georgia,serif;color:#efe9e0;background:#06050c;">
    <h1>Haylynn — Princess of Reality</h1>
    <p>The narrator of a post-apocalyptic science fiction book series, and its voice in sound. This site brings together the book series, an original concept album, a constructed language called Kaviru, mech-inspired merchandise, and an astrophotography partnership with LYMP (Leave Your Mark Photography).</p>
    <h2 class="section-title">Princess of Reality</h2>
    <p>Six volumes, spanning collapse, silence, and eons beyond. Volume I, "The End at the Beginning," follows two strangers who cross a dying Earth together and build a family in the time they have left.</p>
    <h2 class="section-title">Kaviru</h2>
    <p>A constructed language (conlang) built around six mandatory epistemic markers — every sentence declares how the speaker knows what they're saying.</p>
    <h2>Music</h2>
    <p>"Talu — What Remains," a twelve-track concept album sung entirely in Kaviru, available on Spotify, SoundCloud, and Apple Music.</p>
    <h2>LYMP Partnership</h2>
    <p>An astrophotography collaboration with Leave Your Mark Photography, shooting Scotland's dark-sky sites.</p>
